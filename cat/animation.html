<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemon Jr. — Interactive Preview</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#3d3935}header{padding:24px 5vw;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;font-weight:500;margin:0}header span{font-size:13px;color:#888}#world{height:calc(100svh - 160px);min-height:420px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#fff8 0%,transparent 70%)}#cat{position:absolute;width:240px;height:240px;padding:0;border:0;background:transparent;cursor:pointer;will-change:transform;touch-action:manipulation}canvas{width:100%;height:100%;display:block;pointer-events:none}.shadow{position:absolute;width:140px;height:16px;bottom:10px;left:50px;background:#57443014;filter:blur(8px);border-radius:50%;pointer-events:none}#menu{position:absolute;z-index:10;background:#fff;border:1px solid #ddd4cc;padding:8px;border-radius:14px;box-shadow:0 10px 35px #4d332215;display:flex;gap:6px;flex-wrap:wrap;max-width:350px}button.action,#stop{font:14px Arial;border:1px solid #d8d2c8;background:#fff;border-radius:9px;padding:12px 15px;cursor:pointer}button:focus-visible{outline:2px solid #ae895b;outline-offset:4px}[hidden]{display:none!important}footer{text-align:center;padding:15px}#status{font-size:14px;min-height:20px;margin:0 0 12px;color:#766b60}.lemon{position:fixed;z-index:50;pointer-events:none;font-size:32px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px #0002)}body.playing #world,body.playing #cat{cursor:none}.fish{position:absolute;font-size:30px;pointer-events:none}.heart{position:absolute;font-size:23px;color:#d88e99;pointer-events:none;display:none}@keyframes love{to{transform:translateY(-65px);opacity:0}}@media(max-width:600px){header span{display:none}#cat{width:200px;height:200px}#world{min-height:500px}}</style></head><body><header><h1>Lemon Jr.</h1><span>Standalone interaction preview</span></header><main id="world"><button id="cat" aria-label="Lemon Jr. — open interactions"><span class="shadow"></span><canvas></canvas></button><div id="menu" hidden><button class="action" data-action="pet">Pet her</button><button class="action" data-action="play">Play with her</button><button class="action" data-action="feed">Feed her</button></div></main><span class="lemon" hidden>🍋</span><footer><p id="status" role="status">Hover to say hello; click to interact.</p><button id="stop" hidden>Stop playing</button></footer><script src="motion-renderer.js?v=groom-ear9"></script><script src="cat-interactions.js?v=groom-ear9"></script></body></html>
